spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nerlogix}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:nerlogix}
    password: ${SPRING_DATASOURCE_PASSWORD:nerlogix}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
